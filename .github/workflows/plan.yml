name: plan
# Runs the morning pitch on demand, and immediately when the Claude scheduled task pushes
# queue/pitches/<date>.json (the tick would also pick it up within 15 minutes).
on:
  push:
    branches: [main]
    paths: ["queue/pitches/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Pitch again even if today's batch was already sent"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prod-manor-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pitch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m agent plan ${{ inputs.force && '--force' || '' }} ${{ github.event_name == 'workflow_dispatch' && '--fallback' || '' }}
      - name: Save state
        if: always()
        run: bash scripts/commit_state.sh "plan"
