name: render
# Started by the tick whenever you approve a pitch. Renders the reels, hosts them on GitHub Pages
# (so Instagram can fetch them), and sends you a preview in Telegram.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prod-manor-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Install sound + voice tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
          pip install -q piper-tts || echo "piper not available; espeak-ng fallback"
      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: .voices
          key: piper-voice-en_US-ryan-medium
      - name: Download Piper voice (first run only)
        run: |
          mkdir -p .voices
          V=en_US-ryan-medium; B=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium
          [ -f .voices/$V.onnx ] || curl -fsSL -o .voices/$V.onnx $B/$V.onnx || true
          [ -f .voices/$V.onnx.json ] || curl -fsSL -o .voices/$V.onnx.json $B/$V.onnx.json || true
      - name: Restore hosted media
        run: |
          git clone --depth 1 -b media "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" media 2>/dev/null || mkdir -p media
          rm -rf media/.git
      - name: Render approved reels
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          PM_WORKERS: "4"
        run: python -m agent render
      - name: Store media on the media branch
        run: |
          cd media
          git init -q -b media
          git config user.name "prod-manor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "media $(date -u +%FT%TZ)" || true
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" media
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: media
      - uses: actions/deploy-pages@v4
      - name: Save render results
        if: always()
        run: bash scripts/commit_state.sh "render" state/rendered
