document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"861fb1f9-2f29-469c-b0c1-c1a47114568b\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"08a8995c-c611-4fc0-b589-ba255d7eb3aa\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"879cb65e-f5ec-46a4-ab21-356bbaf2f1b9\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"e588eac2-d4af-4198-aae9-7293e0c15872\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"cfbb2f89-f339-49e5-9624-d518aff16a3e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>html,body{margin:0;background:#F1EEF4;color:#1A1C3A;font-family:'DM Sans',sans-serif} a{color:#3B336E} a:hover{color:#C8233A} *{box-sizing:border-box}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width:1400px;margin:0 auto;padding:64px 48px 96px;display:flex;flex-direction:column;gap:72px\">\n\n  <header data-screen-label=\"Header\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px;padding-bottom:36px;border-bottom:4px solid #1A1C3A\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.18em\">STYLE GUIDE · V1 · FOR LOOK APPROVAL<\u002Fdiv>\n      <h1 style=\"font-family:'Griffy',cursive;font-weight:400;font-size:112px;line-height:1;margin:10px 0 0\">Prod Manor<\u002Fh1>\n    <\u002Fdiv>\n    <p style=\"max-width:470px;margin:0;font-size:19px;line-height:1.5;text-wrap:pretty\">Cute-creepy. Every monster is a bug that came to life at 3 AM after a Friday deploy — spooky enough to read as horror, soft enough to sell as a plush.<\u002Fp>\n  <\u002Fheader>\n\n  <section data-screen-label=\"01 Line\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.14em;color:#5A5F8C\">01<\u002Fdiv>\n      <h2 style=\"font-family:'Griffy',cursive;font-weight:400;font-size:52px;line-height:1;margin:0\">Line<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:120px 1fr;gap:10px 18px;font-size:16px;line-height:1.45\">\n        <div style=\"font-weight:700\">Colour<\u002Fdiv><div>Deep navy <span style=\"font-family:'JetBrains Mono',monospace\">#1A1C3A<\u002Fspan>. Never pure black.<\u002Fdiv>\n        <div style=\"font-weight:700\">Weight<\u002Fdiv><div>1% of the character's height (3.5 px on a 360 px Junior). Scales with the character, never with the screen.<\u002Fdiv>\n        <div style=\"font-weight:700\">Wobble<\u002Fdiv><div>Hand-drawn displacement on every line, props included. Lines breathe; they never look ruled.<\u002Fdiv>\n        <div style=\"font-weight:700\">Joins<\u002Fdiv><div>Round caps, round corners. Limbs merge into one outline; no seams inside a sleeve.<\u002Fdiv>\n        <div style=\"font-weight:700\">Interior<\u002Fdiv><div>Brows, folds and seams at ~70% of the outline weight.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px\">\n      <div style=\"background:#FFFFFF;border:3px solid #1A1C3A;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px\">\n        <x-import component-from-global-scope=\"PMDemo\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" kind=\"line-ok\" size=\"120\" hint-size=\"120px,120px\"><\u002Fx-import>\n        <div style=\"font-size:14px;text-align:center\"><b>Do<\u002Fb> · navy, wobbly, 1%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:3px solid #1A1C3A;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px\">\n        <x-import component-from-global-scope=\"PMDemo\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" kind=\"line-black\" size=\"120\" hint-size=\"120px,120px\"><\u002Fx-import>\n        <div style=\"font-size:14px;text-align:center\"><b>Don't<\u002Fb> · pure black, ruled<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:3px solid #1A1C3A;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px\">\n        <x-import component-from-global-scope=\"PMDemo\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" kind=\"line-thin\" size=\"120\" hint-size=\"120px,120px\"><\u002Fx-import>\n        <div style=\"font-size:14px;text-align:center\"><b>Don't<\u002Fb> · hairline<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"02 Light and shadow\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.14em;color:#5A5F8C\">02<\u002Fdiv>\n      <h2 style=\"font-family:'Griffy',cursive;font-weight:400;font-size:52px;line-height:1;margin:0\">Light &amp; shadow<\u002Fh2>\n      <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.45\">\n        <li>One light: the moon, upper-left.<\u002Fli>\n        <li>One shadow tone per colour, cut as a crescent on the lower-right edge (about 8% of the shape's width).<\u002Fli>\n        <li>Flat fills only. No gradients, rim lights or second highlight tone.<\u002Fli>\n        <li>Two exceptions: the Null's cold glow, and the Leak's 80% translucency plus one gloss streak.<\u002Fli>\n        <li>Paper grain sits over the finished frame, never inside a character.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n        <div style=\"background:#2A2E62;border-radius:14px;padding:16px;width:100%;display:flex;justify-content:center\"><x-import component-from-global-scope=\"PMDemo\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" kind=\"shade-1\" size=\"96\" hint-size=\"96px,96px\"><\u002Fx-import><\u002Fdiv>\n        <div style=\"font-size:14px;text-align:center\">1 · flat base<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n        <div style=\"background:#2A2E62;border-radius:14px;padding:16px;width:100%;display:flex;justify-content:center\"><x-import component-from-global-scope=\"PMDemo\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" kind=\"shade-2\" size=\"96\" hint-size=\"96px,96px\"><\u002Fx-import><\u002Fdiv>\n        <div style=\"font-size:14px;text-align:center\">2 · shadow crescent<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n        <div style=\"background:#2A2E62;border-radius:14px;padding:16px;width:100%;display:flex;justify-content:center\"><x-import component-from-global-scope=\"PMDemo\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" kind=\"shade-3\" size=\"96\" hint-size=\"96px,96px\"><\u002Fx-import><\u002Fdiv>\n        <div style=\"font-size:14px;text-align:center\">3 · outline + wobble<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n        <div style=\"background:#2A2E62;border-radius:14px;padding:16px;width:100%;display:flex;justify-content:center;outline:4px solid #C8233A;outline-offset:-4px\"><x-import component-from-global-scope=\"PMDemo\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" kind=\"shade-bad\" size=\"96\" hint-size=\"96px,96px\"><\u002Fx-import><\u002Fdiv>\n        <div style=\"font-size:14px;text-align:center\"><b>Don't<\u002Fb> · gradient<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"03 Palette\" style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.14em;color:#5A5F8C\">03<\u002Fdiv>\n      <h2 style=\"font-family:'Griffy',cursive;font-weight:400;font-size:52px;line-height:1;margin:0\">Palette<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.45;max-width:720px\">The manor is cold: navy and violet. Each character owns exactly one signature accent, used nowhere else. Junior's orange is the only warm colour in the house.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:0.12em\">THE MANOR<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:84px;border-radius:12px;background:#1A1C3A;border:3px solid #1A1C3A\"><\u002Fdiv><div style=\"font-size:14px;font-weight:700\">Ink<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">#1A1C3A<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:84px;border-radius:12px;background:#0B0C1F;border:3px solid #1A1C3A\"><\u002Fdiv><div style=\"font-size:14px;font-weight:700\">Blackout<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">#0B0C1F<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:84px;border-radius:12px;background:#2A2E62;border:3px solid #1A1C3A\"><\u002Fdiv><div style=\"font-size:14px;font-weight:700\">Hallway wall<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">#2A2E62<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:84px;border-radius:12px;background:#22265A;border:3px solid #1A1C3A\"><\u002Fdiv><div style=\"font-size:14px;font-weight:700\">Wainscot<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">#22265A<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:84px;border-radius:12px;background:#3B336E;border:3px solid #1A1C3A\"><\u002Fdiv><div style=\"font-size:14px;font-weight:700\">Violet shadow<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">#3B336E<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"height:84px;border-radius:12px;background:#C9D3F4;border:3px solid #1A1C3A\"><\u002Fdiv><div style=\"font-size:14px;font-weight:700\">Moonlight<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:13p lections. Only the antennae differ: prongs vs. linked loops.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#2A2E62;border:3px solid #1A1C3A;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;color:#EEF1F8\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;height:190px\">\n          <div style=\"background:#F1EEF4;border-radius:12px;padding:10px\"><x-import component-from-global-scope=\"PMDemo\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" kind=\"g-leak\" size=\"72\" hint-size=\"72px,72px\"><\u002Fx-import><\u002Fdiv>\n          <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"leak\" height=\"150\" hint-size=\"194px,150px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"font-family:'Griffy',cursive;font-size:32px;color:#EE56B8\">The Leak<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.45\">Puddle-dome. Spreads, never stands. Swallowed objects float inside: mugs, cables, and the ears of every listener it never released.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#2A2E62;border:3px solid #1A1C3A;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;color:#EEF1F8\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;height:190px\">\n          <div style=\"background:#F1EEF4;border-radius:12px;padding:10px\"><x-import component-from-global-scope=\"PMDemo\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" kind=\"g-ollie\" size=\"72\" hint-size=\"72px,72px\"><\u002Fx-import><\u002Fdiv>\n          <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"ollie\" height=\"190\" hint-size=\"86px,190px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"font-family:'Griffy',cursive;font-size:32px;color:#E8BC3E\">Ollie One-Off<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.45\">Tall rectangle tilted 7°. Everything is one step off: jacket buttoned a hole low, right eye a little high, a \"0\" on his lapel.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"05 Silhouette test\" style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.14em;color:#5A5F8C\">05<\u002Fdiv>\n      <h2 style=\"font-family:'Griffy',cursive;font-weight:400;font-size:52px;line-height:1;margin:0\">Silhouette test<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.45;max-width:720px\">Solid black, correct relative heights. A design passes when every character can be named from the bottom row — that's the size of a Reel thumbnail.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:3px solid #1A1C3A;border-radius:18px;padding:36px 32px 24px;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-wrap:nowrap;align-items:flex-end;justify-content:space-between;gap:16px;overflow-x:auto;border-bottom:3px solid #1A1C3A;padding-bottom:4px\">\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"junior\" scale=\"0.36\" silhouette=\"true\" hint-size=\"105px,132px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"null\" scale=\"0.36\" silhouette=\"true\" hint-size=\"85px,125px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"caller\" scale=\"0.36\" silhouette=\"true\" hint-size=\"132px,77px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"twins\" scale=\"0.36\" silhouette=\"true\" hint-size=\"104px,58px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"leak\" scale=\"0.36\" silhouette=\"true\" hint-size=\"99px,76px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"ollie\" scale=\"0.36\" silhouette=\"true\" hint-size=\"73px,162px\"><\u002Fx-import>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px\">\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"junior\" scale=\"0.13\" silhouette=\"true\" hint-size=\"38px,48px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"null\" scale=\"0.13\" silhouette=\"true\" hint-size=\"31px,45px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"caller\" scale=\"0.13\" silhouette=\"true\" hint-size=\"48px,28px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"twins\" scale=\"0.13\" silhouette=\"true\" hint-size=\"37px,21px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"leak\" scale=\"0.13\" silhouette=\"true\" hint-size=\"36px,28px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"ollie\" scale=\"0.13\" silhouette=\"true\" hint-size=\"27px,59px\"><\u002Fx-import>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#5A5F8C;margin-left:8px\">← thumbnail size<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"06 Built for cut-out\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.14em;color:#5A5F8C\">06<\u002Fdiv>\n      <h2 style=\"font-family:'Griffy',cursive;font-weight:400;font-size:52px;line-height:1;margin:0\">Built for cut-out<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.45\">Every character separates into rig-ready layers with clean overlaps. Mouths and eyes are swap sets, not redraws.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;font-size:15px;line-height:1.4\">\n        <div><b>Head<\u002Fb> · hair + tuft as one piece<\u002Fdiv>\n        <div><b>Face<\u002Fb> · eyes, brows, mouth swaps<\u002Fdiv>\n        <div><b>Torso<\u002Fb> · hoodie, collar, headphones<\u002Fdiv>\n        <div><b>Arms<\u002Fb> · sleeve + hand, pivot at shoulder<\u002Fdiv>\n        <div><b>Legs<\u002Fb> · denim + shoes<\u002Fdiv>\n        <div><b>Props<\u002Fb> · laptop, mug, flashlight<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.45;color:#3B336E\">Same rule for the cast: the Null's tag, the Caller's dial, receiver and plug, each twin, Ollie's pin and donut box are their own layers.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:3px solid #1A1C3A;border-radius:18px;padding:80px 60px;display:flex;justify-content:center\">\n      <x-import component-from-global-scope=\"PMChar\" from=\"b8fad5be-048d-42d3-9fff-4ca12310e34b#/prodmanor.js\" who=\"junior\" scale=\"0.9\" explode=\"1\" hint-size=\"263px,331px\"><\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"07 Type\" style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.14em;color:#5A5F8C\">07<\u002Fdiv>\n      <h2 style=\"font-family:'Griffy',cursive;font-weight:400;font-size:52px;line-height:1;margin:0\">Type<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n      <div style=\"border:3px solid #1A1C3A;border-radius:18px;padding:24px;background:#FFFFFF;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:0.12em\">TITLES &amp; NAMES · GRIFFY<\u002Fdiv>\n        <div style=\"font-family:'Griffy',cursive;font-size:64px;line-height:1\">Fork &amp; Join<\u002Fdiv>\n        <div style=\"font-size:14px;color:#3B336E\">Names in the character's accent with a 4–8 px ink drop. Never for body copy.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:3px solid #1A1C3A;border-radius:18px;padding:24px;background:#FFFFFF;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:0.12em\">CODE &amp; LABELS · JETBRAINS MONO<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:800;line-height:1.1\">console.log(null)<\u002Fdiv>\n        <div style=\"font-size:14px;color:#3B336E\">On-screen code, timestamps, prop labels and the Null's tag.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:3px solid #1A1C3A;border-radius:18px;padding:24px;background:#FFFFFF;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:0.12em\">CAPTIONS · DM SANS<\u002Fdiv>\n        <div style=\"font-size:30px;font-weight:700;line-height:1.15\">It's 3 AM. Something is returning undefined.<\u002Fdiv>\n        <div style=\"font-size:14px;color:#3B336E\">Subtitles and explainer copy. Bold, 1–2 lines, centre-safe.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"08 Dos and donts\" style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:0.14em;color:#5A5F8C\">08<\u002Fdiv>\n      <h2 style=\"font-family:'Griffy',cursive;font-weight:400;font-size:52px;line-height:1;margin:0\">Dos &amp; don'ts<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n      <div style=\"border:3px solid #1A1C3A;border-radius:18px;padding:26px;background:#FFFFFF;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Griffy',cursive;font-size:34px;color:#4C8A12\">Do<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.45\">\n          <li>Keep every character nameable as a black silhouette at thumbnail size.<\u002Fli>\n          <li>Give each new character one accent no one else uses; everything else stays navy and violet.<\u002Fli>\n          <li>Hide the bug joke in the design itself — the null tag, the off-by-one buttons.<\u002Fli>\n          <li>Push one feature hard: Junior's hoodie, Ollie's height, the Caller's dial.<\u002Fli>\n          <li>Design eyes big enough to act: at least a quarter of the head's width.<\u002Fli>\n          <li>Build in separable parts with clean overlaps.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"border:3px solid #1A1C3A;border-radius:18px;padding:26px;background:#FFFFFF;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:'Griffy',cursive;font-size:34px;color:#C8233A\">Don't<\u002Fdiv>\n        <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.45\">\n          <li>Use pure black (#000) for lines or fills.<\u002Fli>\n          <li>Add gradients, rim lights or a second highlight tone.<\u002Fli>\n          <li>Draw hair strands, clothing folds or texture that can't be cut out.<\u002Fli>\n          <li>Borrow another character's accent, even for a prop.<\u002Fli>\n          <li>Go gory. Creepy, never gross.<\u002Fli>\n          <li>Set prop text smaller than it can be read in a close-up.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
