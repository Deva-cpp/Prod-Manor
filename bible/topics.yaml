  - {topic: "unhandled promise rejection crashes the Node process", fix: "await or .catch every promise", monster: twins, tech: Node.js, lang: javascript}
  - {topic: "Promise.all drops every result when one request fails", fix: "Promise.allSettled", monster: twins, tech: JavaScript, lang: javascript}
  - {topic: "blocking requests.get inside async def freezes the event loop", fix: "httpx.AsyncClient (or run_in_executor)", monster: twins, tech: Python asyncio, lang: python}
  - {topic: "threads don't speed up CPU-heavy Python work (the GIL)", fix: "ProcessPoolExecutor", monster: twins, tech: Python, lang: python}
  - {topic: "Go goroutines write the same map: concurrent map writes fatal error", fix: "sync.Mutex around the map (or sync.Map)", monster: twins, tech: Go, lang: go}
