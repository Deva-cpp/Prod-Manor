# Topic backlog per monster. The producer rotates monsters and picks unused topics first.
# Add your own ideas any time; level is beginner | intermediate | advanced.
# The planner prefers the target level (config `level`, Telegram /level) and skips anything already taught.
"null":  # quoted: a bare null key is YAML None
  - {topic: "API response missing a nested field crashes the profile page", fix: "user?.address?.city ?? 'Unknown'", level: intermediate, lang: javascript}
  - {topic: "calling an optional callback prop that was never passed", fix: "onSave?.()", level: intermediate, lang: javascript}
  - {topic: "JSON.parse(localStorage.getItem(key)) returns null on first visit", fix: "?? default object", level: intermediate, lang: javascript}
  - {topic: "TypeScript non-null assertion ! hides a real undefined", fix: "narrow with an if check instead of !", level: intermediate, lang: typescript}
  - {topic: "Python Optional return used without checking None", fix: "if result is None: return early", level: intermediate, lang: python}
  - {topic: "calling a method on null", fix: "optional chaining ?.", level: beginner, lang: javascript}
  - {topic: "undefined object property access", fix: "default with ?? (nullish coalescing)", level: beginner, lang: javascript}
  - {topic: "|| vs ?? treating 0 and empty string as missing", fix: "use ?? instead of ||", level: intermediate, lang: javascript}
  - {topic: "dict key missing KeyError", fix: "dict.get(key, default)", level: beginner, lang: python}
  - {topic: "None returned from a function that forgot to return", fix: "add the return statement", level: beginner, lang: python}
  - {topic: "array.find returns undefined", fix: "check the result before using it", level: beginner, lang: javascript}
  - {topic: "NullPointerException on unboxing", fix: "Optional / null check", level: intermediate, lang: java}
  - {topic: "destructuring undefined function argument", fix: "default parameter = {}", level: intermediate, lang: javascript}
caller:
  - {topic: "Python RecursionError walking a deeply nested JSON/tree", fix: "iterative walk with an explicit stack", level: intermediate, lang: python}
  - {topic: "retry loop that retries forever when the API is down", fix: "max attempts with backoff", level: intermediate, lang: javascript}
  - {topic: "toJSON / __repr__ that references itself through a circular object", fix: "break the cycle (skip the back-reference)", level: intermediate, lang: javascript}
  - {topic: "event handler that triggers the same event it handles", fix: "guard flag or compare before setting", level: intermediate, lang: javascript}
  - {topic: "recursion without a base case", fix: "add the base case", level: beginner, lang: python}
  - {topic: "maximum call stack size exceeded", fix: "base case that is actually reachable", level: beginner, lang: javascript}
  - {topic: "factorial recursion", fix: "if n <= 1: return 1", level: beginner, lang: python}
  - {topic: "fibonacci recursion exploding calls", fix: "memoization with lru_cache", level: intermediate, lang: python}
  - {topic: "infinite while loop forgetting to update the counter", fix: "increment inside the loop", level: beginner, lang: javascript}
  - {topic: "useEffect infinite re-render loop", fix: "add the dependency array", level: intermediate, lang: javascript}
  - {topic: "setter calling itself", fix: "write to the backing field", level: intermediate, lang: javascript}
twins:
  - {topic: "search box: an older slow response overwrites the newer one", fix: "AbortController cancels the stale request", level: intermediate, lang: javascript}
  - {topic: "Promise.all fails everything when one request fails", fix: "Promise.allSettled", level: intermediate, lang: javascript}
  - {topic: "async function in Python called without await returns a coroutine", fix: "await it (or asyncio.gather)", level: intermediate, lang: python}
  - {topic: "payment button charges twice on retry", fix: "idempotency key on the request", level: intermediate, lang: javascript}
  - {topic: "stale closure: setCount(count + 1) twice only adds one", fix: "functional update setCount(c => c + 1)", level: intermediate, lang: javascript}
  - {topic: "two requests updating the same counter (lost update)", fix: "use a lock / atomic increment", level: intermediate, lang: python}
  - {topic: "forgetting await so code runs out of order", fix: "await the promise", level: beginner, lang: javascript}
  - {topic: "deadlock: two threads acquire locks in opposite order", fix: "always acquire locks in the same order", level: intermediate, lang: python}
  - {topic: "double-click submits the form twice", fix: "disable the button while submitting", level: beginner, lang: javascript}
  - {topic: "forEach with async callback doesn't wait", fix: "for...of with await, or Promise.all", level: intermediate, lang: javascript}
  - {topic: "check-then-act race on a file or a seat booking", fix: "make it atomic (transaction)", level: intermediate, lang: python}
leak:
