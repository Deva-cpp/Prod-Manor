  - {topic: "EventEmitter listener added per request: MaxListenersExceededWarning", fix: "register once at startup or remove the listener", monster: leak, tech: Node.js, lang: javascript}
  - {topic: "reading a 5 GB file into memory at once", fix: "stream it line by line", monster: leak, tech: Python, lang: python}
