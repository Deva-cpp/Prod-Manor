  - {topic: "functools.lru_cache on a method keeps every instance alive", fix: "cache outside the instance or use maxsize", level: intermediate, lang: python}
  - {topic: "WebSocket/subscription never unsubscribed when leaving the page", fix: "unsubscribe in cleanup", level: intermediate, lang: javascript}
  - {topic: "Map used as a per-object cache keeps objects alive forever", fix: "WeakMap", level: intermediate, lang: javascript}
  - {topic: "event listener never removed", fix: "removeEventListener in cleanup", level: intermediate, lang: javascript}
  - {topic: "setInterval never cleared", fix: "clearInterval on cleanup", level: beginner, lang: javascript}
  - {topic: "useEffect without cleanup function", fix: "return a cleanup function", level: intermediate, lang: javascript}
  - {topic: "global cache that grows forever", fix: "bounded LRU cache", level: intermediate, lang: python}
  - {topic: "appending to a list inside a loop that never empties", fix: "clear or bound the list", level: beginner, lang: python}
  - {topic: "mutable default argument keeps growing", fix: "default to None then create the list", level: intermediate, lang: python}
  - {topic: "file opened and never closed", fix: "with open(...) as f", level: beginner, lang: python}
