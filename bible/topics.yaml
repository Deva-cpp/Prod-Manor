# Topic backlog: real production bugs, no beginner syntax. The series climbs three stages in order:
#   languages  → production bugs in plain Python / JavaScript / TypeScript / Java / Go / PHP
#   frameworks → the frameworks teams actually ship: Node/Express, NestJS, Next.js, React, Django, FastAPI, Flask,
#                Spring Boot, Laravel, ORMs, Celery, GraphQL
#   tools      → industry infrastructure: Kafka, Redis, PostgreSQL, MySQL, MongoDB, Elasticsearch, RabbitMQ, Docker,
#                Kubernetes, AWS, GCP, Terraform, Nginx, CI/CD, observability, HTTP/gRPC
# With `stage: auto` (config / Telegram /stage auto) the planner teaches a stage until its topics are used up, then
# moves on. Topics already taught are skipped forever. When everything is used, the brain invents new ones.
# monster = which cast member's bug family it belongs to:
#   null: missing values, config, permissions, signals nobody receives   caller: loops, retries, redelivery, restarts
#   twins: races, duplicates, ordering, consistency                      leak: memory, connections, cost, slowness
#   ollie: off-by-one, limits, units, time zones, pagination, ordering of steps
# Add your own any time: {topic, fix, monster, tech, lang}. lang = the language the code beat is written in.

languages:
