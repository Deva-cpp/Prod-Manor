<!doctype html>
<html>
<head>

<style>
  @font-face { font-family: 'DM Sans'; src: url('fonts/DMSans.woff2') format('woff2'); font-weight: 100 1000; }

  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0B0C1F; }

<div style="position:absolute;left:-9999px;font-family:'DM Sans';font-weight:700">.</div>
<div style="position:absolute;left:-9999px;font-family:'JetBrains Mono';font-weight:800">.</div>
<script src="pm-characters.js"></script>
<script src="engine.js"></script>

</html>
